name: CI

on:
    push:
        branches: [main]
    pull_request:

env:
    FLUTTER_VERSION: "3.44.4"
    RUST_TOOLCHAIN: "1.90.0"

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux
                      os: ubuntu-latest
                    - platform: windows
                      os: windows-latest
                    - platform: macos
                      os: macos-latest
                    - platform: ios
                      os: macos-latest
                    - platform: android
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v7

            - name: Install Linux build dependencies
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update -y
                  sudo apt-get install -y ninja-build libgtk-3-dev pkg-config libfontconfig1-dev clang cmake xvfb

            - name: Enable KVM (android)
              if: matrix.platform == 'android'
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ env.RUST_TOOLCHAIN }}

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust

            - uses: actions/setup-java@v5
              if: matrix.platform == 'android'
              with:
                  distribution: temurin
                  java-version: "17"

            - uses: android-actions/setup-android@v4
              if: matrix.platform == 'android'

            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: ${{ env.FLUTTER_VERSION }}
                  channel: stable
                  cache: true

            - name: Enable desktop support
              if: matrix.platform == 'linux' || matrix.platform == 'windows' || matrix.platform == 'macos'
              run: flutter config --enable-${{ matrix.platform }}-desktop

            - run: flutter pub get
              working-directory: example

            - name: Build (linux)
              if: matrix.platform == 'linux'
              run: flutter build linux --debug
              working-directory: example

            - name: Build (windows)
              if: matrix.platform == 'windows'
              run: flutter build windows --debug
              working-directory: example

            - name: Build (macos)
              if: matrix.platform == 'macos'
              run: flutter build macos --debug
              working-directory: example

            - name: Build (ios)
              if: matrix.platform == 'ios'
              run: flutter build ios --debug --no-codesign
              working-directory: example

            - name: Build (android)
              if: matrix.platform == 'android'
              run: flutter build apk --debug
              working-directory: example

            - name: Test (linux)
              if: matrix.platform == 'linux'
              run: xvfb-run -a flutter test integration_test/map_smoke_test.dart -d linux
              working-directory: example

            - name: Test (windows)
              if: matrix.platform == 'windows'
              run: flutter test integration_test/map_smoke_test.dart -d windows
              working-directory: example

            - name: Test (macos)
              if: matrix.platform == 'macos'
              run: flutter test integration_test/map_smoke_test.dart -d macos
              working-directory: example

            - name: Boot iOS Simulator
              if: matrix.platform == 'ios'
              run: |
                  UDID=$(xcrun simctl list devices available iPhone -j \
                    | python3 -c "import json,sys; devices=json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime in devices.values() for d in runtime))")
                  xcrun simctl boot "$UDID"
                  echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

            - name: Test (ios)
              if: matrix.platform == 'ios'
              run: flutter test integration_test/map_smoke_test.dart -d "$IOS_SIMULATOR_UDID"
              working-directory: example

            - name: Test (android)
              if: matrix.platform == 'android'
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  target: google_apis
                  arch: x86_64
                  working-directory: example
                  script: flutter test integration_test/map_smoke_test.dart -d emulator-5554
